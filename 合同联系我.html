<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我 - 合同财务智能中台</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, sans-serif;
}
body {
  background: #0b0f1a;
  color: #eaefff;
  min-height: 100vh;
}

/* 背景 */
.未来背景 {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 30% 20%, #141a35 0%, #0b0f1a 70%);
  z-index: -2;
}
.网格线条 {
  position: fixed;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image:
    linear-gradient(rgba(79,195,247,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,213,79,0.07) 1px, transparent 1px);
  background-size: 100px 100px;
  z-index: -1;
  animation: 缓慢移动 20s linear infinite;
}
@keyframes 缓慢移动 {
  0% { transform: translate(0,0); }
  100% { transform: translate(50px,50px); }
}
.法务光效 {
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(79,195,247,0.12), transparent 60%);
  top: 10%;
  left: -100px;
  z-index: -1;
}
.财务光效 {
  position: fixed;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(255,213,79,0.1), transparent 60%);
  bottom: 10%;
  right: -100px;
  z-index: -1;
}

/* 导航 */
.导航栏 {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(12,17,32,0.7);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,0.1);
  z-index: 999;
}
.导航内容 {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px;
  height: 70px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.网站标题 {
  font-size: 22px;
  font-weight: 600;
  background: linear-gradient(90deg, #4fc3f7, #ffd54f);
  -webkit-background-clip: text;
  color: transparent;
}
.导航菜单 a {
  margin-left: 28px;
  color: #c3c9e4;
  text-decoration: none;
}
.导航菜单 a:hover {
  color: #4fc3f7;
}

/* 页面 */
.页面容器 {
  max-width: 1100px;
  margin: 0 auto;
  padding: 120px 24px 60px;
}
.页面标题 {
  font-size: 32px;
  text-align: center;
  margin-bottom: 40px;
  background: linear-gradient(90deg, #4fc3f7, #ffd54f);
  -webkit-background-clip: text;
  color: transparent;
}

/* 卡片 */
.个人卡片 {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 32px;
  backdrop-filter: blur(10px);
  max-width: 600px;
  margin: 0 auto;
}
.头像 {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4fc3f7, #ffd54f);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #fff;
}
.姓名 {
  font-size: 24px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 8px;
}
.专业 {
  text-align: center;
  color: #aaa;
  margin-bottom: 24px;
}
.信息组 {
  display: grid;
  gap: 12px;
}
.信息项 {
  background: rgba(255,255,255,0.04);
  padding: 12px 14px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}
.标签 {
  color: #aaa;
}
.值 {
  color: #4fc3f7;
  font-weight: 500;
}
</style>
</head>

<body>

<div class="未来背景"></div>
<div class="网格线条"></div>
<div class="法务光效"></div>
<div class="财务光效"></div>

<div class="导航栏">
  <div class="导航内容">
    <div class="网站标题">合同财务智能中台</div>
    <div class="导航菜单">
      <a href="index.html">首页</a>
      <a href="智能中台.html">智能中台</a>
      <a href="联系我.html">联系我</a>
    </div>
  </div>
</div>

<div class="页面容器">
  <h1 class="页面标题">联系我</h1>

  <div class="个人卡片">
    <div class="头像">👨‍💻</div>
    <div class="姓名">你的姓名</div>
    <div class="专业">会计专业 | AI编程 | 项目开发</div>

    <div class="信息组">
      <div class="信息项">
        <span class="标签">邮箱</span>
        <span class="值">your-email@example.com</span>
      </div>
 
      <div class="信息项">
        <span class="标签">微信</span>
        <span class="值">your-wechat-id</span>
      </div>
      <div class="信息项">
        <span class="标签">项目介绍</span>
        <span class="值">合同财务智能中台</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
