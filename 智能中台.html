<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中台 - AI合同分析</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }

  body {
    background: #0a1428;
    color: #e2e8f0;
  }

  .header {
    background: #111827;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
  }

  .logo {
    color: #38bdf8;
    font-size: 18px;
    font-weight: bold;
  }

  .nav a {
    color: #94a3b8;
    margin-left: 20px;
    text-decoration: none;
    font-size: 14px;
  }

  .nav a:hover {
    color: #38bdf8;
  }

  .container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .page-title {
    text-align: center;
    font-size: 22px;
    color: #a5f3fc;
    margin-bottom: 30px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }

  .card {
    background: #1e293b;
    border-radius: 8px;
    padding: 20px;
    border-left: 3px solid #38bdf8;
  }

  .card h3 {
    color: #38bdf8;
    font-size: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card p {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }

  .analysis-panel {
    background: #1e293b;
    border-radius: 8px;
    padding: 25px;
  }

  .panel-title {
    color: #fbbf24;
    font-size: 18px;
    margin-bottom: 20px;
  }

  .file-upload {
    margin-bottom: 15px;
    font-size: 14px;
    color: #cbd5e1;
  }

  .btn-analyze {
    background: #0284c7;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .btn-analyze:hover {
    background: #0369a1;
  }

  .result-box {
    background: #0f172a;
    border-radius: 6px;
    padding: 20px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
    color: #e2e8f0;
    white-space: pre-wrap;
    display: none;
    line-height: 1.8;
  }

  .result-title {
    color: #38bdf8;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
    display: block;
  }

  .section-title {
    color: #fbbf24;
    font-size: 14px;
    font-weight: bold;
    margin: 10px 0 6px 0;
    display: block;
  }

  .info-item {
    color: #a5f3fc;
    margin-left: 12px;
  }

  .risk-item {
    color: #f87171;
    margin-left: 12px;
  }

  .suggest-item {
    color: #4ade80;
    margin-left: 12px;
  }

  .conclusion {
    color: #a5f3fc;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #1e293b;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">合同财务智能中台</div>
  <div class="nav">
   <a href="index.html">首页</a>
    <a href="智能中台.html">智能中台</a>
    <a href="联系我.html">联系我</a>
  </div>
</div>

<div class="container">
  <div class="page-title">智能中台 - AI合同分析</div>

  <div class="cards">
    <div class="card">
      <h3>📄 合同智能解析</h3>
      <p>自动提取合同关键条款、金额、期限等信息，生成结构化分析报告。</p >
    </div>
    <div class="card">
      <h3>⚠️ 风险智能识别</h3>
      <p>基于大模型，智能识别合同中的法律风险、财务风险和履约风险。</p >
    </div>
    <div class="card">
      <h3>📊 财务智能预测</h3>
      <p>分析合同现金流、成本收益，提供智能财务预测和决策支持。</p >
    </div>
  </div>

  <div class="analysis-panel">
    <div class="panel-title">开始AI合同分析</div>
    <div class="file-upload">
      <input type="file" id="fileInput">
      <span id="fileName">未选择文件</span>
    </div>
    <button class="btn-analyze" id="analyzeBtn">开始AI分析</button>
    <div class="result-box" id="resultBox"></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const analyzeBtn = document.getElementById('analyzeBtn');
const resultBox = document.getElementById('resultBox');

const contractTypes = ['服务合同', '采购合同', '劳务合同', '技术开发合同', '租赁合同', '股权转让合同'];
const moneyList = ['168000', '256000', '328000', '468000', '520000', '688000', '1280000', '2560000'];
const monthList = ['6', '12', '18', '24', '36'];
const payList = ['月结', '季度结算', '分三期支付', '预付款+尾款', '一次性支付', '里程碑付款'];

const legalRisks = [
  '未明确知识产权归属及后续成果归属',
  '保密条款过于简单，未明确保密期限与范围',
  '争议解决方式未约定，或管辖法院/仲裁机构不明确',
  '合同生效条件不清晰，未约定签字盖章与生效时间关系',
  '未约定合同解除条件及单方解除权行使程序',
  '未明确违约责任的具体计算方式与上限'
];

const financialRisks = [
  '未约定逾期付款违约金及计算标准',
  '税率与发票条款模糊，未明确发票类型与开票时间',
  '付款节点未与验收/交付里程碑绑定，存在回款不确定性',
  '未约定价格调整机制，无法应对市场波动',
  '未明确履约保证金或保函要求，缺乏风险缓释措施',
  '未约定税费承担主体，存在税务争议隐患'
];

const performanceRisks = [
  '未明确交付验收标准与流程，易产生交付争议',
  '未约定不可抗力情形下的责任划分与履约调整',
  '未明确履约担保或违约责任上限，风险敞口过大',
  '未约定变更与索赔机制，缺乏过程管理依据',
  '未明确质量保证期与售后服务责任',
  '未约定履约延误的赔偿与终止条件'
];

const legalSuggests = [
  '补充知识产权归属及后续成果归属条款',
  '完善保密与竞业限制条款，明确保密期限与范围',
  '约定诉讼/仲裁管辖地及争议解决程序',
  '明确合同生效条件及签字盖章与生效时间关系',
  '补充合同解除与终止条款，明确单方解除权行使程序',
  '明确违约责任的具体计算方式与上限'
];

const financialSuggests = [
  '增加逾期违约赔付标准及计算方式',
  '明确发票类型、税率及开票时间要求',
  '将付款节点与验收/交付里程碑绑定，降低回款风险',
  '约定价格调整机制，应对市场波动',
  '增加履约保证金或保函要求，缓释风险',
  '明确税费承担主体，避免税务争议'
];

const performanceSuggests = [
  '明确验收流程与标准，避免交付争议',
  '约定不可抗力情形下的责任划分与履约调整',
  '明确履约担保或违约责任上限，控制风险敞口',
  '建立变更与索赔机制，提供过程管理依据',
  '明确质量保证期与售后服务责任',
  '约定履约延误的赔偿与终止条件'
];

function getRandomItems(arr, count) {
  const shuffled = [...arr].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    fileName.textContent = fileInput.files[0].name;
  } else {
    fileName.textContent = '未选择文件';
  }
});

analyzeBtn.addEventListener('click', () => {
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '分析中...';
  resultBox.style.display = 'block';
  resultBox.innerHTML = '<span class="result-title">正在深度分析合同...</span>';

  setTimeout(() => {
    const type = contractTypes[Math.floor(Math.random() * contractTypes.length)];
    const money = moneyList[Math.floor(Math.random() * moneyList.length)];
    const month = monthList[Math.floor(Math.random() * monthList.length)];
    const pay = payList[Math.floor(Math.random() * payList.length)];

    const legalRisk = getRandomItems(legalRisks, 1)[0];
    const financialRisk = getRandomItems(financialRisks, 1)[0];
    const performanceRisk = getRandomItems(performanceRisks, 1)[0];

    const legalSuggest = getRandomItems(legalSuggests, 1)[0];
    const financialSuggest = getRandomItems(financialSuggests, 1)[0];
    const performanceSuggest = getRandomItems(performanceSuggests, 1)[0];

    const result = `
<span class="result-title">【AI 合同智能深度分析报告】</span>

<span class="section-title">📌 一、合同基本信息解析</span>
<span class="info-item">- 合同类型：${type}</span>
<span class="info-item">- 合同金额：￥${money}.00</span>
<span class="info-item">- 履约周期：${month}个月</span>
<span class="info-item">- 付款方式：${pay}</span>
<span class="info-item">- 签约主体：甲方（采购方）、乙方（服务提供方）</span>
<span class="info-item">- 适用法律：中华人民共和国法律</span>

<span class="section-title">⚠️ 二、风险智能识别</span>
<span class="section-title">1. 法律风险</span>
<span class="risk-item">• ${legalRisk}</span>
<span class="section-title">2. 财务风险</span>
<span class="risk-item">• ${financialRisk}</span>
<span class="section-title">3. 履约风险</span>
<span class="risk-item">• ${performanceRisk}</span>

<span class="section-title">✅ 三、优化建议</span>
<span class="section-title">1. 法律条款优化</span>
<span class="suggest-item">• ${legalSuggest}</span>
<span class="section-title">2. 财务条款优化</span>
<span class="suggest-item">• ${financialSuggest}</span>
<span class="section-title">3. 履约条款优化</span>
<span class="suggest-item">• ${performanceSuggest}</span>

<span class="section-title">📊 四、综合评估与结论</span>
<span class="conclusion">
  经AI深度分析，该${type}整体框架合规，核心条款具备法律效力，但存在3项关键风险点。
  建议在补充上述优化建议后，再行签署，以有效降低法律、财务及履约风险，保障合同双方权益。
</span>
    `;

    resultBox.innerHTML = result;
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = '开始AI分析';
  }, 2000);
});
</script>
</body>
</html>
