<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同财务智能中台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#165DFF',secondary:'#36CFC9',success:'#10b981',warning:'#f59e0b',danger:'#ef4444',darkBg:'#0f172a',cardBg:'#1e293b',textGray:'#94a3b8'}}}}
</script>
<style>
body{background-color:#0f172a;background-image:radial-gradient(circle at 100% 150%,#0f172a 24%,transparent 25%,transparent 100%),radial-gradient(circle at 0% 50%,#0f172a 24%,transparent 25%,transparent 100%),radial-gradient(circle at 50% 0%,#0f172a 24%,transparent 25%,transparent 100%);background-size:60px 60px}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);background-size:40px 40px;z-index:-1}
.text-gradient{background-clip:text;-webkit-background-clip:text;color:transparent;background-image:linear-gradient(90deg,#165DFF,#36CFC9)}
.tech-card{position:relative;overflow:hidden;transition:all 0.4s ease;border:1px solid rgba(22,93,255,0.2)}
.tech-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(22,93,255,0.1),transparent);animation:lightMove 3s infinite linear}
.tech-card:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 0 25px rgba(22,93,255,0.3);border-color:rgba(22,93,255,0.5)}
@keyframes lightMove{0%{left:-100%}100%{left:100%}}
.nav-item{position:relative;transition:color 0.3s}
.nav-item::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:2px;background:linear-gradient(90deg,#165DFF,#36CFC9);transition:width 0.3s}
.nav-item:hover::after{width:100%}
#status{transition:all 0.3s}
</style>
</head>
<body class="text-gray-100 min-h-screen">
<header class="py-4 px-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800/50 backdrop-blur-md sticky top-0 z-50 border-b border-slate-700">
    <div class="flex items-center gap-2">
        <i class="fa fa-file-text-o text-primary text-xl"></i>
        <h1 class="text-xl font-bold text-gradient">合同财务智能中台</h1>
    </div>
    <nav class="flex gap-6 text-sm">
        <a class="nav-item font-medium text-primary">首页</a >
        <a class="nav-item font-medium hover:text-primary transition">智能中台</a >
        <a class="nav-item font-medium hover:text-primary transition">联系我</a >
    </nav>
    <div class="flex items-center gap-3">
        <span id="fname" class="text-sm text-textGray">未上传</span>
        <span id="status" class="text-sm"></span>
        <label class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg flex items-center gap-2 cursor-pointer text-sm transition">
            <i class="fa fa-upload"></i>上传合同
            <input type="file" id="file" accept=".txt,.docx" class="hidden">
        </label>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6">
<div id="dashboard" class="block">
    <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-primary mb-3">合同全流程智能分析</h2>
        <p class="text-textGray">AI 解析 · 财务台账 · 风险审查 · 三流合一</p >
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div onclick="go('parse')" class="tech-card bg-cardBg rounded-xl p-6 cursor-pointer">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-primary/15 text-primary flex items-center justify-center"><i class="fa fa-file-text-o fa-lg"></i></div>
                <h3 class="text-lg font-semibold">合同智能解析</h3>
            </div>
            <p class="text-textGray text-sm">提取甲乙方、金额、税率、日期、违约条款</p >
        </div>
        <div onclick="go('ledger')" class="tech-card bg-cardBg rounded-xl p-6 cursor-pointer">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-primary/15 text-primary flex items-center justify-center"><i class="fa fa-calculator fa-lg"></i></div>
                <h3 class="text-lg font-semibold">财务自动台账</h3>
            </div>
            <p class="text-textGray text-sm">自动算税额、付款计划、款项明细</p >
        </div>
        <div onclick="go('risk')" class="tech-card bg-cardBg rounded-xl p-6 cursor-pointer">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-warning/15 text-warning flex items-center justify-center"><i class="fa fa-exclamation-triangle fa-lg"></i></div>
                <h3 class="text-lg font-semibold">法务风险审查</h3>
            </div>
            <p class="text-textGray text-sm">识别霸王条款、权责不对等风险</p >
        </div>
        <div onclick="go('three')" class="tech-card bg-cardBg rounded-xl p-6 cursor-pointer">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-success/15 text-success flex items-center justify-center"><i class="fa fa-check-circle fa-lg"></i></div>
                <h3 class="text-lg font-semibold">三流合一校验</h3>
            </div>
            <p class="text-textGray text-sm">合同/资金/发票一致性校验</p >
        </div>
    </div>
</div>

<div id="detail" class="hidden">
    <button onclick="back()" class="flex items-center gap-2 text-primary mb-4">
        <i class="fa fa-arrow-left"></i>返回
    </button>
    <div id="content" class="bg-cardBg rounded-xl p-6"></div>
</div>
</main>

<script>
let uploaded = false;
let data = {
  a: "西安未来信息科技有限公司",
  b: "福州星辰商务服务有限公司",
  amt: 80000,
  tax: 13,
  date: "2026年3月1日",
  pay: "预付款30%，完工后70%",
  per: "2026年3月1日 - 2026年9月1日",
  pen: "支付合同总金额10%的违约金"
};

const $ = id => document.getElementById(id);

$("#file").addEventListener("change", async function(e) {
  const f = e.target.files[0];
  if (!f) return;

  $("#fname").innerText = f.name;
  $("#status").innerText = "⏳ 解析中...";
  $("#status").className = "text-sm text-blue-400";
  uploaded = false;

  try {
    // 模拟解析过程
    await new Promise(resolve => setTimeout(resolve, 1000));
    $("#status").innerText = "✅ 解析成功";
    $("#status").className = "text-sm text-green-400";
    uploaded = true;
  } catch (err) {
    $("#status").innerText = "❌ 解析失败";
    $("#status").className = "text-sm text-red-400";
    uploaded = false;
  }
});

function back() {
  $("#dashboard").classList.remove("hidden");
  $("#detail").classList.add("hidden");
}

function go(page) {
  if (!uploaded) {
    alert("请先上传合同并等待解析完成");
    return;
  }

  $("#dashboard").classList.add("hidden");
  $("#detail").classList.remove("hidden");
  const c = $("#content");
  const d = data;

  if (page === "parse") {
    c.innerHTML = `<h3 class="text-xl font-bold mb-4 text-gradient">合同智能解析</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
<div class="p-3 bg-slate-800/50 rounded">甲方：${d.a}</div>
<div class="p-3 bg-slate-800/50 rounded">乙方：${d.b}</div>
<div class="p-3 bg-slate-800/50 rounded">合同金额：${d.amt} 元</div>
<div class="p-3 bg-slate-800/50 rounded">税率：${d.tax}%</div>
<div class="p-3 bg-slate-800/50 rounded">签订日期：${d.date}</div>
<div class="p-3 bg-slate-800/50 rounded">付款方式：${d.pay}</div>
<div class="p-3 bg-slate-800/50 rounded">合同期限：${d.per}</div>
<div class="p-3 bg-slate-800/50 rounded">违约责任：${d.pen}</div>
</div>`;
  }

  if (page === "ledger") {
    c.innerHTML = `<h3 class="text-xl font-bold mb-4 text-gradient">财务自动台账</h3>
<div class="space-y-3 text-sm">
<div class="p-3 bg-slate-800/50 rounded">合同总额：${d.amt} 元</div>
<div class="p-3 bg-slate-800/50 rounded">税率：${d.tax}%</div>
<div class="p-3 bg-slate-800/50 rounded">预付款30%：${(d.amt*0.3).toFixed(2)} 元</div>
<div class="p-3 bg-slate-800/50 rounded">尾款70%：${(d.amt*0.7).toFixed(2)} 元</div>
<div class="p-3 bg-slate-800/50 rounded">税额：${(d.amt*d.tax/100).toFixed(2)} 元</div>
</div>`;
  }

  if (page === "risk") {
    c.innerHTML = `<h3 class="text-xl font-bold mb-4 text-gradient">法务风险审查</h3>
<div class="p-4 bg-slate-800/50 rounded text-sm">
✅ 合同主体清晰<br>
✅ 金额明确<br>
✅ 税率合法<br>
✅ 违约责任明确<br>
✅ 争议管辖有效<br><br>
🌟 风险等级：低风险
</div>`;
  }

  if (page === "three") {
    c.innerHTML = `<h3 class="text-xl font-bold mb-4 text-gradient">三流合一校验</h3>
<div class="space-y-3 text-sm">
<div class="p-3 bg-slate-800/50 rounded">合同金额：${d.amt} 元</div>
<div class="p-3 bg-slate-800/50 rounded">资金流：${d.amt} 元</div>
<div class="p-3 bg-slate-800/50 rounded">发票流：${d.amt} 元</div>
<div class="p-4 bg-green-500/10 text-green-400 rounded text-center font-bold">✅ 三流一致，无税务风险</div>
</div>`;
  }
}
</script>
</body>
</html>
