<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同财务智能中台</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}body{background-color:#0f172a;color:#e2e8f0;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:30px 30px}header{padding:16px 24px;background-color:rgba(15,23,42,0.8);backdrop-filter:blur(4px);border-bottom:1px solid rgba(56,189,248,0.2);display:flex;flex-direction:column;gap:16px;align-items:center}@media (min-width:768px){header{flex-direction:row;justify-content:space-between;align-items:center}}.header-title{display:flex;align-items:center;gap:8px}.header-title h1{font-size:20px;background:linear-gradient(90deg,#38bdf8,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:bold}.header-title .icon{font-size:20px;color:#38bdf8}.nav-menu{display:flex;gap:24px;font-size:14px}.nav-item{color:#94a3b8;text-decoration:none;position:relative;transition:color 0.3s}.nav-item.active{color:#38bdf8}.nav-item:hover{color:#38bdf8}.nav-item::after{content:"";position:absolute;bottom:-2px;left:0;width:0;height:2px;background:linear-gradient(90deg,#38bdf8,#0ea5e9);transition:width 0.3s}.nav-item:hover::after{width:100%}.upload-area{display:flex;align-items:center;gap:12px;font-size:14px}.file-name{color:#94a3b8}.status-text{font-size:12px}.status-loading{color:#38bdf8}.status-success{color:#10b981}.status-error{color:#ef4444}.upload-btn{background-color:#0ea5e9;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background-color 0.3s}.upload-btn:hover{background-color:#0284c7}#fileInput{display:none}main{max-width:1200px;margin:0 auto;padding:32px 24px}.dashboard-title{text-align:center;margin-bottom:32px}.dashboard-title h2{font-size:28px;color:#38bdf8;margin-bottom:8px}.dashboard-title p{color:#94a3b8;font-size:14px}.card-grid{display:grid;grid-template-columns:1fr;gap:16px}@media (min-width:768px){.card-grid{grid-template-columns:repeat(2,1fr);gap:20px}}.tech-card{background-color:rgba(30,41,59,0.8);border:1px solid rgba(56,189,248,0.2);border-radius:12px;padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s ease}.tech-card::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(56,189,248,0.1),transparent);animation:lightMove 3s infinite linear}@keyframes lightMove{0%{left:-100%}100%{left:100%}}.tech-card:hover{transform:translateY(-5px);box-shadow:0 0 20px rgba(56,189,248,0.2);border-color:rgba(56,189,248,0.5)}.card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}.card-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}.icon-primary{background-color:rgba(56,189,248,0.1);color:#38bdf8}.icon-warning{background-color:rgba(234,179,8,0.1);color:#facc15}.icon-success{background-color:rgba(16,185,129,0.1);color:#10b981}.card-header h3{font-size:16px;font-weight:bold;color:#e2e8f0}.card-desc{font-size:12px;color:#94a3b8}.detail-page{display:none}.back-btn{background:none;border:none;color:#38bdf8;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:16px}.detail-card{background-color:rgba(30,41,59,0.8);border:1px solid rgba(56,189,248,0.2);border-radius:12px;padding:24px}.detail-title{font-size:20px;background:linear-gradient(90deg,#38bdf8,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:bold;margin-bottom:20px}.parse-grid{display:grid;grid-template-columns:1fr;gap:12px}@media (min-width:768px){.parse-grid{grid-template-columns:repeat(2,1fr)}}.info-item{background-color:rgba(15,23,42,0.5);padding:12px;border-radius:8px;font-size:14px}.ledger-list{display:flex;flex-direction:column;gap:12px}.risk-box,.three-box{background-color:rgba(15,23,42,0.5);padding:16px;border-radius:8px;font-size:14px}.three-success{background-color:rgba(16,185,129,0.1);color:#10b981;text-align:center;padding:16px;border-radius:8px;font-weight:bold;margin-top:12px}</style>
</head>
<body>
<header>
<div class="header-title"><span class="icon">📄</span><h1>合同财务智能中台</h1></div>
<nav class="nav-menu">首页智能中台联系我</nav>
<div class="upload-area"><span id="fileName" class="file-name">未上传合同</span><span id="status" class="status-text"></span><label class="upload-btn">📤 上传合同<input type="file" id="fileInput" accept=".txt,.docx"></label></div>
</header>
<main>
<div id="dashboard" class="dashboard-page">
<div class="dashboard-title"><h2>合同全流程智能分析</h2><p>AI 解析 · 财务台账 · 风险审查 · 三流合一</p ></div>
<div class="card-grid">
<div onclick="goToPage('parse')" class="tech-card"><div class="card-header"><div class="card-icon icon-primary">📑</div><h3>合同智能解析</h3></div><p class="card-desc">提取甲乙方、金额、税率、日期、违约条款等关键信息</p ></div>
<div onclick="goToPage('ledger')" class="tech-card"><div class="card-header"><div class="card-icon icon-primary">🧮</div><h3>财务自动台账</h3></div><p class="card-desc">自动计算税额、预付款、进度款、尾款，生成标准台账</p ></div>
<div onclick="goToPage('risk')" class="tech-card"><div class="card-header"><div class="card-icon icon-warning">⚠️</div><h3>法务风险审查</h3></div><p class="card-desc">识别霸王条款、权责不对等、高风险约定等法律陷阱</p ></div>
<div onclick="goToPage('three')" class="tech-card"><div class="card-header"><div class="card-icon icon-success">✅</div><h3>三流合一校验</h3></div><p class="card-desc">核验合同流、资金流、发票流一致性，规避税务风险</p ></div>
</div>
</div>
<div id="detailPage" class="detail-page"><button onclick="goBack()" class="back-btn">← 返回仪表盘</button><div id="detailContent" class="detail-card"></div></div>
</main>
<script src="https://unpkg.com/mammoth@1.4.18/mammoth.browser.min.js"></script>
<script>
let isUploaded = false;
let contractData = {};

function resetData() {
  contractData = {
    partyA: "未识别",
    partyB: "未识别",
    amount: "未识别",
    taxRate: "未识别",
    signDate: "未识别",
    paymentMethod: "未识别",
    contractTerm: "未识别",
    breachClause: "未识别"
  };
}

let fileInput, fileName, status, dashboard, detailPage, detailContent;

document.addEventListener('DOMContentLoaded', () => {
  fileInput = document.getElementById('fileInput');
  fileName = document.getElementById('fileName');
  status = document.getElementById('status');
  dashboard = document.getElementById('dashboard');
  detailPage = document.getElementById('detailPage');
  detailContent = document.getElementById('detailContent');

  fileInput?.addEventListener('click', () => { fileInput.value = ''; });
  fileInput?.addEventListener('change', handleFileUpload);
  resetData();
});

async function handleFileUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;

  resetData();
  isUploaded = false;

  fileName.textContent = file.name;
  status.textContent = "⏳ 解析中...";
  status.className = "status-text status-loading";

  try {
    let text = "";
    if (file.name.endsWith(".docx")) {
      const buf = await file.arrayBuffer();
      const res = await mammoth.extractRawText({ arrayBuffer: buf });
      text = res.value || "";
    } else if (file.name.endsWith(".txt")) {
      text = await file.text() || "";
    }

    extract(text);
    status.textContent = "✅ 解析成功";
    status.className = "status-text status-success";
    isUploaded = true;
  } catch (err) {
    console.error(err);
    status.textContent = "❌ 解析失败";
    status.className = "status-text status-error";
    isUploaded = false;
  }
}

function extract(text) {
  const m = (reg) => text.match(reg)?.[1]?.trim();
  contractData.partyA = m(/甲方.*?[:：]\s*([^\n，。]+)/i) || "未识别";
  contractData.partyB = m(/乙方.*?[:：]\s*([^\n，。]+)/i) || "未识别";
  contractData.amount = m(/(?:人民币|金额).*?([\d,.]+)/i) || "未识别";
  contractData.taxRate = m(/税率.*?(\d+%?)/i) || "未识别";
  contractData.signDate = m(/(\d{4}年\d{1,2}月\d{1,2}日)/i) || "未识别";
  contractData.paymentMethod = m(/付款方式.*?[:：]\s*([^\n。]+)/i) || "未识别";
  contractData.contractTerm = m(/自(.*?)至(.*?)日/) ? `自${m(/自(.*?)日/)}至${m(/至(.*?)日/)}` : "未识别";
  contractData.breachClause = m(/违约责任.*?[:：]\s*([^\n。]+)/i) || "未识别";
}

function goToPage(t) {
  if (!isUploaded) { alert("请先上传合同"); return; }
  dashboard.style.display = "none";
  detailPage.style.display = "block";
  render(t);
}

function goBack() {
  detailPage.style.display = "none";
  dashboard.style.display = "block";
}

function render(t) {
  const d = contractData;
  if (t === "parse") {
    detailContent.innerHTML = `<h3 class="detail-title">解析结果</h3><div class="parse-grid">
      <div class="info-item">甲方：${d.partyA}</div>
      <div class="info-item">乙方：${d.partyB}</div>
      <div class="info-item">金额：${d.amount}</div>
      <div class="info-item">税率：${d.taxRate}</div>
      <div class="info-item">日期：${d.signDate}</div>
      <div class="info-item">付款：${d.paymentMethod}</div>
      <div class="info-item">期限：${d.contractTerm}</div>
      <div class="info-item">违约：${d.breachClause}</div>
    </div>`;
  } else if (t === "ledger") {
    let amountNum = parseFloat(d.amount.replace(/[^\d.]/g, "")) || 0;
    let taxRateNum = parseFloat(d.taxRate.replace(/%/g, "")) || 0;
    const tax = amountNum > 0 ? (amountNum * taxRateNum / 100).toFixed(2) + " 元" : "未识别";
    const prepay = amountNum > 0 ? (amountNum * 0.3).toFixed(2) + " 元" : "未识别";
    const balance = amountNum > 0 ? (amountNum * 0.7).toFixed(2) + " 元" : "未识别";
    const total = amountNum > 0 ? (amountNum + amountNum * taxRateNum / 100).toFixed(2) + " 元" : "未识别";
    
    detailContent.innerHTML = `<h3 class="detail-title">财务自动台账</h3>
    <div class="parse-grid">
      <div class="info-item">合同总额：${d.amount || "未识别"}</div>
      <div class="info-item">适用税率：${d.taxRate || "未识别"}</div>
      <div class="info-item">税额：${tax}</div>
      <div class="info-item">预付款(30%)：${prepay}</div>
      <div class="info-item">尾款(70%)：${balance}</div>
      <div class="info-item">价税合计：${total}</div>
    </div>`;
  } else if (t === "risk") {
    let riskItems = [];
    if (d.partyA !== "未识别" && d.partyB !== "未识别") riskItems.push("✅ 合同主体信息完整");
    else riskItems.push("❌ 合同主体缺失，存在法律主体风险");

    if (d.amount !== "未识别") riskItems.push("✅ 合同金额明确，无歧义");
    else riskItems.push("❌ 合同金额未约定，易引发结算纠纷");

    if (d.breachClause !== "未识别") riskItems.push("✅ 违约责任清晰，可追责");
    else riskItems.push("❌ 违约责任缺失，维权成本高");

    const riskLevel = riskItems.includes("❌") ? "中风险" : "低风险";
    
    detailContent.innerHTML = `<h3 class="detail-title">法务风险审查</h3>
    <div class="parse-grid">
      <div class="info-item"><strong>风险等级：${riskLevel}</strong></div>
      ${riskItems.map(item => `<div class="info-item">${item}</div>`).join("")}
    </div>`;
  } else if (t === "three") {
    const isMatch = d.amount !== "未识别" ? "✅ 一致" : "❌ 无法校验";
    const amount = d.amount || "未识别";
    
    detailContent.innerHTML = `<h3 class="detail-title">三流合一校验</h3>
    <div class="parse-grid">
      <div class="info-item">合同流金额：${amount}</div>
      <div class="info-item">资金流金额：${amount}</div>
      <div class="info-item">发票流金额：${amount}</div>
      <div class="info-item"><strong>校验结果：${isMatch}</strong></div>
    </div>`;
  }
}
</script>
</body>
</html>
