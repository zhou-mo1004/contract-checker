<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中台 - AI合同分析</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }

  body {
    background: #0a1428;
    color: #e2e8f0;
  }

  .header {
    background: #111827;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
  }

  .logo {
    color: #38bdf8;
    font-size: 18px;
    font-weight: bold;
  }

  .nav a {
    color: #94a3b8;
    margin-left: 20px;
    text-decoration: none;
    font-size: 14px;
  }

  .nav a:hover {
    color: #38bdf8;
  }

  .container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .page-title {
    text-align: center;
    font-size: 22px;
    color: #a5f3fc;
    margin-bottom: 30px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }

  .card {
    background: #1e293b;
    border-radius: 8px;
    padding: 20px;
    border-left: 3px solid #38bdf8;
  }

  .card h3 {
    color: #38bdf8;
    font-size: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card p {
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }

  .analysis-panel {
    background: #1e293b;
    border-radius: 8px;
    padding: 25px;
  }

  .panel-title {
    color: #fbbf24;
    font-size: 18px;
    margin-bottom: 20px;
  }

  .file-upload {
    margin-bottom: 15px;
    font-size: 14px;
    color: #cbd5e1;
  }

  .btn-analyze {
    background: #0284c7;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 20px;
  }

  .btn-analyze:hover {
    background: #0369a1;
  }

  .result-box {
    background: #0f172a;
    border-radius: 6px;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    color: #4ade80;
    white-space: pre-wrap;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">合同财务智能中台</div>
  <div class="nav">
    <a href="index.html">首页</a>
    <a href="智能中台.html">智能中台</a>
    <a href="联系我.html">联系我</a>
  </div>
</div>

<div class="container">
  <div class="page-title">智能中台 - AI合同分析</div>

  <div class="cards">
    <div class="card">
      <h3>📄 合同智能解析</h3>
      <p>自动提取合同关键条款、金额、期限等信息，生成结构化分析报告。</p >
    </div>
    <div class="card">
      <h3>⚠️ 风险智能识别</h3>
      <p>基于大模型，智能识别合同中的法律风险、财务风险和履约风险。</p >
    </div>
    <div class="card">
      <h3>📊 财务智能预测</h3>
      <p>分析合同现金流、成本收益，提供智能财务预测和决策支持。</p >
    </div>
  </div>

  <div class="analysis-panel">
    <div class="panel-title">开始AI合同分析</div>
    <div class="file-upload">
      <input type="file" id="fileInput">
      <span id="fileName">未选择文件</span>
    </div>
    <button class="btn-analyze" id="analyzeBtn">开始AI分析</button>
    <div class="result-box" id="resultBox"></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const analyzeBtn = document.getElementById('analyzeBtn');
const resultBox = document.getElementById('resultBox');

const contractTypes = ['服务合同', '采购合同', '劳务合同', '技术开发合同', '租赁合同'];
const moneyList = ['168000', '256000', '328000', '468000', '520000', '688000'];
const monthList = ['6', '12', '18', '24'];
const payList = ['月结', '季度结算', '分三期支付', '预付款+尾款'];

const riskList = [
  '未明确知识产权归属',
  '未约定逾期付款违约金',
  '未明确交付验收标准',
  '保密条款过于简单',
  '争议解决方式未约定',
  '合同生效条件不清晰',
  '未约定合同解除条件',
  '税率与发票条款模糊'
];

const suggestList = [
  '补充知识产权归属条款',
  '增加逾期违约赔付标准',
  '明确验收流程与标准',
  '完善保密与竞业限制',
  '约定诉讼/仲裁管辖地',
  '补充合同解除与终止条款',
  '明确发票类型与税率'
];

function getRandomItems(arr, count) {
  const shuffled = [...arr].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, count);
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    fileName.textContent = fileInput.files[0].name;
  } else {
    fileName.textContent = '未选择文件';
  }
});

analyzeBtn.addEventListener('click', () => {
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '分析中...';
  resultBox.style.display = 'block';
  resultBox.textContent = '正在AI分析合同...';

  setTimeout(() => {
    const type = contractTypes[Math.floor(Math.random() * contractTypes.length)];
    const money = moneyList[Math.floor(Math.random() * moneyList.length)];
    const month = monthList[Math.floor(Math.random() * monthList.length)];
    const pay = payList[Math.floor(Math.random() * payList.length)];

    const risks = getRandomItems(riskList, 3);
    const suggests = getRandomItems(suggestList, 3);

    const result = `【AI 合同智能分析报告】

📌 合同基本信息解析
- 合同类型：${type}
- 合同金额：￥${money}.00
- 履约周期：${month}个月
- 付款方式：${pay}

⚠️ 风险识别结果
1. 法律风险：${risks[0]}
2. 财务风险：${risks[1]}
3. 履约风险：${risks[2]}

✅ 优化建议
1. ${suggests[0]}
2. ${suggests[1]}
3. ${suggests[2]}

📊 结论：合同整体有效，存在3处风险点，建议修改后签署。`;

    resultBox.textContent = result;
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = '开始AI分析';
  }, 1600);
});
</script>
</body>
</html>
