`html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中台 - 合同财务智能中台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif}
body{background:#0a0e1a;color:#eaefff;min-height:100vh}
.bg-gradient{position:fixed;width:100%;height:100%;background:radial-gradient(circle at 30% 20%,#141a35 0,#0a0e1a 70%);z-index:-2}
.grid-lines{position:fixed;width:200%;height:200%;top:-50%;left:-50%;background-image:linear-gradient(rgba(79,195,247,.06) 1px,transparent 0),linear-gradient(90deg,rgba(255,213,79,.06) 1px,transparent 0);background-size:80px 80px;z-index:-1;animation:gridMove 25s linear infinite}
@keyframes gridMove{0%{transform:translate(0,0)}100%{transform:translate(80px,80px)}}
.light-effect{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(79,195,247,.1),transparent 60%);top:15%;left:-100px;z-index:-1}
.light-effect2{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(255,213,79,.08),transparent 60%);bottom:15%;right:-100px;z-index:-1}
.navbar{position:fixed;top:0;width:100%;background:rgba(10,14,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);z-index:999}
.nav-container{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:600;background:linear-gradient(90deg,#4fc3f7,#ffd54f);-webkit-background-clip:text;color:transparent}
.nav-menu a{margin-left:24px;color:#c3c9e4;text-decoration:none;font-size:14px;transition:color .3s}
.nav-menu a:hover{color:#4fc3f7}
.container{max-width:1200px;margin:0 auto;padding:100px 24px 60px}
.page-title{font-size:28px;text-align:center;margin-bottom:40px;background:linear-gradient(90deg,#4fc3f7,#ffd54f);-webkit-background-clip:text;color:transparent}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:40px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px;transition:all .3s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:rgba(79,195,247,.5);background:rgba(255,255,255,.07)}
.card-icon{font-size:24px;margin-bottom:12px}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px;color:#fff}
.card-desc{font-size:13px;color:#aaa}
.upload-area{background:rgba(255,255,255,.05);border:2px dashed #4fc3f7;border-radius:16px;padding:40px 20px;text-align:center;transition:all .3s;margin-bottom:30px}
.upload-area:hover{background:rgba(79,195,247,.1);border-color:#66d9ff}
#fileInput{display:none}
.upload-text{font-size:16px;color:#aaa}
.result-section{background:rgba(255,255,255,.05);border-radius:16px;padding:24px;display:none}
.result-title{font-size:18px;margin-bottom:16px;color:#4fc3f7}
.result-content{line-height:1.8;color:#eee;white-space:pre-wrap;font-size:14px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#4fc3f7;animation:spin .8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-message{color:#ff6b6b;padding:10px;background:rgba(255,107,107,.1);border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="grid-lines"></div>
<div class="light-effect"></div>
<div class="light-effect2"></div>

<div class="navbar">
  <div class="nav-container">
    <div class="logo">合同财务智能中台</div>
    <div class="nav-menu">
      首页
      智能中台
      联系我
    </div>
  </div>
</div>

<div class="container">
  <h1 class="page-title">智能中台</h1>

  <div class="card-grid">
    <div class="card" onclick="triggerUpload()">
      <div class="card-icon">📄</div>
      <div class="card-title">1. 上传合同并解析</div>
      <div class="card-desc">支持 PDF / Word / TXT，自动提取文本</div>
    </div>
    <div class="card">
      <div class="card-icon">🔍</div>
      <div class="card-title">2. 合同智能解析</div>
      <div class="card-desc">甲方、乙方、金额、日期自动提取</div>
    </div>
    <div class="card">
      <div class="card-icon">💰</div>
      <div class="card-title">3. 财务自动对账</div>
      <div class="card-desc">金额、发票、风险一键分析</div>
    </div>
    <div class="card">
      <div class="card-icon">⚠️</div>
      <div class="card-title">4. 法务风险审查</div>
      <div class="card-desc">条款风险 + 修改建议</div>
    </div>
  </div>

  <div class="upload-area" onclick="triggerUpload()">
    <input type="file" id="fileInput" accept=".txt,.pdf,.docx">
    <div class="upload-text">✅ 点击这里上传合同（TXT / PDF / DOCX）</div>
  </div>

  <div class="result-section" id="resultBox">
    <div class="result-title">AI 合同审查结果</div>
    <div class="result-content" id="resultText"></div>
  </div>
</div>

<script>
// ============ 你的百度千帆密钥（已正确配置）============
const API_KEY = "ALTAKsJVt9XKhuSyHM9uzqeEXv";      // AccessKey ID
const SECRET_KEY = "677e2573191347d0b3c62cdcd1af0141";  // AccessKey Secret

// ============ 全局变量 ============
const fileInput = document.getElementById("fileInput");
const resultBox = document.getElementById("resultBox");
const resultText = document.getElementById("resultText");

// 触发文件上传
function triggerUpload() {
  fileInput.click();
}

// ============ 文件选择处理 ============
fileInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // 显示结果区域
  resultBox.style.display = "block";
  resultText.innerHTML = `<span class="loading"></span> 正在读取：${file.name}`;

  try {
    // 步骤1: 读取文件内容
    const text = await readAnyFile(file);
    resultText.innerHTML = '<span class="loading"></span> 读取成功，正在获取访问令牌...';
    
    // 步骤2: 获取 access_token
    const token = await getAccessToken();
    resultText.innerHTML = '<span class="loading"></span> 令牌获取成功，正在调用AI分析...';
    
    // 步骤3: 调用AI分析
    await analyzeContract(text, token);
  } catch (err) {
    // 显示详细错误信息
    resultText.innerHTML = `
      <div class="error-message">
        ❌ 错误：${err.message}<br><br>
        <small>请检查：<br>
        1. 百度千帆平台是否已开通模型服务<br>
        2. Access Key 是否有权限<br>
        3. 控制台查看更多错误详情</small>
      </div>
    `;
    console.error("完整错误信息:", err);
  }
});

// ============ 文件读取函数 ============
async function readAnyFile(file) {
  const fileName = file.name.toLowerCase();
  
  // 读取TXT文件
  if (fileName.endsWith(".txt")) {
    return await file.text();
  }

  // 读取PDF文件
  if (fileName.endsWith(".pdf")) {
    try {
      // 动态加载PDF.js
      const pdfjsLib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";
      
      const arrayBuffer = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
      const pdf = await loadingTask.promise;
      
      let fullText = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(" ");
        fullText += pageText + "\n";
      }
      return fullText;
    } catch (error) {
      throw new Error(`PDF读取失败: ${error.message}`);
    }
  }

  // 读取DOCX文件
  if (fileName.endsWith(".docx")) {
    try {
      // 动态加载mammoth.js
      const mammoth = await import("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/build/mammoth.browser.min.mjs");
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
      return result.value;
    } catch (error) {
      throw new Error(`Word读取失败: ${error.message}`);
    }
  }

  throw new Error("不支持的文件格式，请上传TXT、PDF或DOCX文件");
}

// ============ 获取access_token（修复版）============
async function getAccessToken() {
  try {
    // 使用直接的API地址，不用代理
    const tokenUrl = "https://aip.baidubce.com/oauth/2.0/token";
    const params = new URLSearchParams({
      grant_type: "client_credentials",
      client_id: API_KEY,
      client_secret: SECRET_KEY
    });

    const response = await fetch(`${tokenUrl}?${params}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      }
    });

    const data = await response.json();
    
    if (data.error) {
      throw new Error(`获取token失败: ${data.error_description || data.error}`);
    }
    
    if (!data.access_token) {
      throw new Error("获取token失败：返回数据中没有access_token");
    }
    
    return data.access_token;
  } catch (error) {
    throw new Error(`认证失败: ${error.message}`);
  }
}

// ============ AI分析函数（修复版）============
async function analyzeContract(text, token) {
  try {
    // 准备提示词
    const prompt = `请对以下合同进行完整审查，严格按照4个部分输出：

【1】合同智能解析
- 甲方： 
- 乙方： 
- 合同金额： 
- 签订日期： 
- 有效期： 
- 付款方式：

【2】财务自动对账
- 应收金额：
- 付款节点：
- 发票要求：
- 财务风险提示：

【3】法务风险审查
- 不公平条款：
- 违约责任：
- 争议解决方式：
- 缺失的重要条款：

【4】修改建议与优化
- 具体修改意见：
- 建议补充的条款：
- 风险规避建议：

合同内容：
${text.slice(0, 6000)}  // 限制长度避免超限
`;

    // 调用千帆API（使用ERNIE-Speed模型）
    const apiUrl = "https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/ernie_speed";
    
    const response = await fetch(`${apiUrl}?access_token=${token}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "user",
            content: prompt
          }
        ],
        temperature: 0.1,
        top_p: 0.8
      })
    });

    const data = await response.json();
    
    // 检查错误
    if (data.error_code) {
      throw new Error(`API错误 ${data.error_code}: ${data.error_msg}`);
    }
    
    // 显示结果
    if (data.result) {
      resultText.innerText = data.result;
    } else {
      throw new Error("API返回数据格式异常");
    }
    
  } catch (error) {
    throw new Error(`AI分析失败: ${error.message}`);
  }
}

// 暴露triggerUpload给全局（用于onclick）
window.triggerUpload = triggerUpload;
</script>
</body>
</html>
```
