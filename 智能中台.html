<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中台 - 合同财务智能中台</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
body {
  background: #0a0e1a;
  color: #eaefff;
  min-height: 100vh;
}
/* 背景与动态效果 */
.bg-gradient {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 30% 20%, #141a35 0%, #0a0e1a 70%);
  z-index: -2;
}
.grid-lines {
  position: fixed;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image:
    linear-gradient(rgba(79,195,247,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,213,79,0.06) 1px, transparent 1px);
  background-size: 80px 80px;
  z-index: -1;
  animation: gridMove 25s linear infinite;
}
@keyframes gridMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(80px, 80px); }
}
.light-effect {
  position: fixed;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(79,195,247,0.1), transparent 60%);
  top: 15%;
  left: -100px;
  z-index: -1;
}
.light-effect2 {
  position: fixed;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255,213,79,0.08), transparent 60%);
  bottom: 15%;
  right: -100px;
  z-index: -1;
}
/* 导航栏 */
.navbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  z-index: 999;
}
.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  height: 64px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(90deg, #4fc3f7, #ffd54f);
  -webkit-background-clip: text;
  color: transparent;
}
.nav-menu a {
  margin-left: 24px;
  color: #c3c9e4;
  text-decoration: none;
  font-size: 14px;
  transition: color 0.3s;
}
.nav-menu a:hover {
  color: #4fc3f7;
}
/* 页面容器 */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 100px 24px 60px;
}
.page-title {
  font-size: 28px;
  text-align: center;
  margin-bottom: 40px;
  background: linear-gradient(90deg, #4fc3f7, #ffd54f);
  -webkit-background-clip: text;
  color: transparent;
}
/* 功能卡片区 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.3s;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-4px);
  border-color: rgba(79,195,247,0.5);
  background: rgba(255,255,255,0.07);
}
.card-icon {
  font-size: 24px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #fff;
}
.card-desc {
  font-size: 13px;
  color: #aaa;
}
/* 上传区域 */
.upload-area {
  background: rgba(255,255,255,0.05);
  border: 2px dashed #4fc3f7;
  border-radius: 16px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  margin-bottom: 30px;
}
.upload-area:hover {
  background: rgba(79,195,247,0.1);
  border-color: #66d9ff;
}
#fileInput {
  display: none;
}
.upload-text {
  font-size: 16px;
  color: #aaa;
}
/* 结果展示区 */
.result-section {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 24px;
  display: none;
}
.result-title {
  font-size: 18px;
  margin-bottom: 16px;
  color: #4fc3f7;
}
.result-content {
  line-height: 1.8;
  color: #eee;
  white-space: pre-wrap;
  font-size: 14px;
}
/* 加载动画 */
.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: #4fc3f7;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

    </div>
  </div>
</div>
