<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能中台 - 合同财务智能中台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif}
body{background:#0a0e1a;color:#eaefff;min-height:100vh}
.bg-gradient{position:fixed;width:100%;height:100%;background:radial-gradient(circle at 30% 20%,#141a35 0,#0a0e1a 70%);z-index:-2}
.grid-lines{position:fixed;width:200%;height:200%;top:-50%;left:-50%;background-image:linear-gradient(rgba(79,195,247,.06) 1px,transparent 0),linear-gradient(90deg,rgba(255,213,79,.06) 1px,transparent 0);background-size:80px 80px;z-index:-1;animation:gridMove 25s linear infinite}
@keyframes gridMove{0%{transform:translate(0,0)}100%{transform:translate(80px,80px)}}
.light-effect{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(79,195,247,.1),transparent 60%);top:15%;left:-100px;z-index:-1}
.light-effect2{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(255,213,79,.08),transparent 60%);bottom:15%;right:-100px;z-index:-1}
.navbar{position:fixed;top:0;width:100%;background:rgba(10,14,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);z-index:999}
.nav-container{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:600;background:linear-gradient(90deg,#4fc3f7,#ffd54f);-webkit-background-clip:text;color:transparent}
.nav-menu a{margin-left:24px;color:#c3c9e4;text-decoration:none;font-size:14px;transition:color .3s}
.nav-menu a:hover{color:#4fc3f7}
.container{max-width:1200px;margin:0 auto;padding:100px 24px 60px}
.page-title{font-size:28px;text-align:center;margin-bottom:40px;background:linear-gradient(90deg,#4fc3f7,#ffd54f);-webkit-background-clip:text;color:transparent}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:24px;margin-bottom:40px}
.card{background:rgba(20,26,53,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:24px;transition:all .3s}
.card:hover{border-color:rgba(79,195,247,.4);transform:translateY(-4px)}
.card-title{font-size:18px;margin-bottom:16px;color:#4fc3f7}
.analysis-section{background:rgba(20,26,53,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:32px;margin-top:40px}
.analysis-title{font-size:20px;margin-bottom:24px;color:#ffd54f}
.file-input{margin-bottom:20px}
.file-input input{color:#eaefff}
.analyze-btn{background:linear-gradient(90deg,#4fc3f7,#0288d1);color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:16px;transition:all .3s}
.analyze-btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(79,195,247,.3)}
.result-area{margin-top:24px;padding:20px;background:rgba(10,14,26,.8);border-radius:8px;min-height:200px;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="grid-lines"></div>
<div class="light-effect"></div>
<div class="light-effect2"></div>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">合同财务智能中台</div>
    <div class="nav-menu">
      <a href="index.html">首页</a>
      <a href="智能中台.html">智能中台</a>
      <a href="联系我.html">联系我</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">智能中台 - AI合同分析</h1>
  
  <div class="card-grid">
    <div class="card">
      <h3 class="card-title">📄 合同智能解析</h3>
      <p>自动提取合同关键条款、金额、期限等信息，生成结构化分析报告。</p >
    </div>
    <div class="card">
      <h3 class="card-title">⚖️ 风险智能识别</h3>
      <p>基于千帆大模型，智能识别合同中的法律风险、财务风险和履约风险。</p >
    </div>
    <div class="card">
      <h3 class="card-title">📊 财务智能预测</h3>
      <p>分析合同现金流、成本收益，提供智能财务预测和决策支持。</p >
    </div>
  </div>

  <div class="analysis-section">
    <h2 class="analysis-title">开始AI合同分析</h2>
    <div class="file-input">
      <input type="file" id="contractFile" accept=".txt,.docx">
    </div>
    <button class="analyze-btn" onclick="analyzeContract()">开始AI分析</button>
    <div id="analysisResult" class="result-area">请上传合同文件并点击分析按钮...</div>
  </div>
</div>

<script>
async function analyzeContract() {
  const file = document.getElementById('contractFile').files[0];
  if (!file) {
    alert('请先选择合同文件！');
    return;
  }

  const resultDiv = document.getElementById('analysisResult');
  resultDiv.innerText = '正在调用千帆AI分析，请稍候...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();

    if (data.ok) {
      resultDiv.innerText = `✅ AI分析完成：\n\n${data.data.aiAnalysis}`;
    } else {
      resultDiv.innerText = `❌ 分析失败：${data.msg}`;
    }
  } catch (err) {
    resultDiv.innerText = `❌ 网络错误：${err.message}`;
  }
}
</script>
</body>
</html>
